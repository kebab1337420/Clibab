[package]
name = "discord-voice-capture"
version = "0.1.0"
edition = "2021"
description = "Alt Discord client that captures one .wav per voice participant (SSRC-demuxed)"

[dependencies]
tokio           = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "time", "sync", "signal"] }
tokio-tungstenite = "0.24"
serde           = { version = "1", features = ["derive"] }
serde_json      = "1"
hound           = "3.5"
base64          = "0.22"
hex             = "0.4"
log             = "0.4"
env_logger      = "0.11"
clap            = { version = "4", features = ["derive"] }
futures         = "0.3"
# Pure-Rust crypto — no C toolchain / wasm / libc required.
aes-gcm         = "0.11"
hkdf            = "0.13"
sha2            = "0.11"
# Pure-Rust Opus decoder (RFC 8251, no unsafe, no FFI, no cmake).
opus-decoder    = { version = "0.1", optional = true }

[[bin]]
name = "discord-voice-capture"
path = "src/main.rs"

[lib]
name = "discord_voice_capture"
path = "src/lib.rs"

# `opus-decoder` is feature-gated (optional = true, wired to `opus_decode` via
# `dep:opus_decoder`). So `cargo check --no-default-features` does NOT compile the
# decoder. The crate is pure-Rust (no cmake / libopus FFI), so build works in
# any no-cmake environment.
[features]
default = ["transport_decrypt"]
opus_decode = ["dep:opus-decoder"]
transport_decrypt = []
